    async function sb(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options, headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", Prefer: options.prefer || "return=representation", ...(options.headers || {}) }
      });
      if (!res.ok) throw new Error(await res.text() || `Http error ${res.status}`);
      const t = await res.text(); return t ? JSON.parse(t) : null;
    }

    function sanitizeHTML(str) {
      if(!str) return '';
      let formatted = str.replace(/\*(.*?)\*/g, '<b>$1</b>').replace(/_(.*?)_/g, '<i>$1</i>').replace(/~(.*?)~/g, '<del>$1</del>');
      const temp = document.createElement('div'); temp.innerHTML = formatted; return temp.innerHTML.replace(/\n/g, '<br>');
    }
    function sanitizeAttr(str) { return String(str || '').replace(/&/g, '&').replace(/"/g, '"').replace(/'/g, ''').replace(/</g, '<').replace(/>/g, '>'); }
    function formatDate(dateStr) { return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); }
    function isVideoUrl(url) { if(!url) return false; const lower = url.toLowerCase(); return lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.mov') || lower.includes('/uploader/cdn'); }
    function getSmartThumbnail(url) {
      if(!url) return ''; const u = url.trim(); const ytMatch = u.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/);
      if (ytMatch && ytMatch[1]) return { type: 'youtube', videoId: ytMatch[1], thumb: `https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg`, url: u };
      if (isVideoUrl(u)) return { type: 'video_direct', thumb: u, url: u };
      if (u.includes('tiktok.com') || u.includes('instagram.com')) return { type: 'social_link', platform: u.includes('tiktok') ? 'TikTok' : 'Instagram', url: u };
      return { type: 'image', thumb: u, url: u };
    }
    function playInlineYoutube(el, videoId) {
      el.onclick = null; el.style.cursor = "default"; const h = el.offsetHeight > 180 ? el.offsetHeight : 280;
      el.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="width:100%; height:${h}px; border-radius:8px;"></iframe>`;
    }
    function renderMediaElement(rawUrl, customStyle = "") {
      if(!rawUrl) return ''; const info = getSmartThumbnail(sanitizeAttr(rawUrl));
      if (info.type === 'youtube') return `<div class="media-thumb-container" style="${customStyle} cursor:pointer;" onclick="playInlineYoutube(this, '${info.videoId}')"><img src="${sanitizeAttr(info.thumb)}" style="width:100%; height:100%; object-fit:cover;"><div class="media-play-icon">▶</div></div>`;
      if (info.type === 'video_direct') return `<div class="media-thumb-container" style="${customStyle}"><video src="${sanitizeAttr(info.url)}" controls preload="metadata" style="width:100%; height:100%; object-fit:cover;"></video></div>`;
      if (info.type === 'social_link') return `<a href="${sanitizeAttr(info.url)}" target="_blank" class="media-thumb-container" style="${customStyle} background:linear-gradient(135deg, #1E293B, #0F172A); display:flex; flex-direction:column; align-items:center; justify-content:center; text-decoration:none;"><span style="font-size:1.5rem; margin-bottom:4px;">🔗</span><span style="font-weight:700; font-size:0.85rem; color:#FFF;">Buka di ${info.platform} ↗</span></a>`;
      return `<img src="${sanitizeAttr(info.thumb)}" style="${customStyle}">`;
    }
    function parseMapsUrl(rawUrl) {
      if (!rawUrl) return null; let str = rawUrl.trim();
      if (str.includes('<iframe')) { const match = str.match(/src=["']([^"']+)["']/); if (match && match[1]) str = match[1]; }
      if (str.includes('google.com/maps/embed')) return str;
      return `https://maps.google.com/maps?q=${encodeURIComponent(str)}&output=embed`;
    }
    function parseKontakUrl(platform, rawVal) {
      if(!rawVal) return ''; let val = rawVal.trim();
      if (val.includes('whatsapp://')) { const match = val.match(/phone=([0-9+]+)/); val = match ? match[1] : val.replace(/[^0-9]/g, ''); }
      if(val.startsWith('http://') || val.startsWith('https://')) { if (val.includes('whatsapp.com') || val.includes('wa.me')) { let num = val.replace(/[^0-9]/g, ''); if(num) return `https://wa.me/${num}`; } return val; }
      if(platform === 'WhatsApp') { let num = val.replace(/[^0-9]/g, ''); if(num.startsWith('0')) num = '62' + num.slice(1); return `https://wa.me/${num}`; } 
      if(platform === 'Instagram') return `https://instagram.com/${val.replace('@', '')}`; 
      if(platform === 'YouTube' || platform === 'TikTok') return `https://${platform.toLowerCase()}.com/${val.startsWith('@') ? val : '@'+val}`; 
      if(platform === 'Email') return `mailto:${val}`; 
      return val;
    }

    function shareArticleLink(event, id, titleEncoded) {
      if (event && event.preventDefault) event.preventDefault();
      if (event && event.stopPropagation) event.stopPropagation();

      const shareUrl = `${window.location.origin}${window.location.pathname}?artikel=${id}`;
      const title = decodeURIComponent(titleEncoded || '');

      if (navigator.share) {
        navigator.share({ title: title || document.title, url: shareUrl }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(() => alert("Link berita disalin!")).catch(() => alert("Link berita: " + shareUrl));
      }
    }

    function getCache(key) { try { return JSON.parse(localStorage.getItem(`smpn20_${key}_cache`)) || []; } catch(e) { return []; } }
    function saveCache(key, data) { try { localStorage.setItem(`smpn20_${key}_cache`, JSON.stringify(data)); } catch(e) {} }

    async function syncDataFromServer() {
      try {
        const [art, gal, kon, prof] = await Promise.all([
          sb('articles?select=*&is_deleted=eq.false&order=created_at.desc&limit=50').catch(()=>null),
          sb('gallery_photos?select=*&is_deleted=eq.false&order=created_at.desc').catch(()=>null),
          sb('kontak_links?select=*&is_deleted=eq.false&order=created_at.desc').catch(()=>null),
          sb('profil_sekolah?select=*').catch(()=>null)
        ]);
        if (art !== null) { state.articles = art; saveCache('articles', art); }
        if (gal !== null) { state.gallery = gal; saveCache('gallery', gal); }
        if (kon !== null) { state.contacts = kon; saveCache('contacts', kon); }
        if (prof && prof.length > 0) { state.profil = prof[0]; localStorage.setItem('smpn20_profil_cache', JSON.stringify(prof[0])); }
        render();
      } catch (error) {}
    }

    async function loadData() {
      state.articles = getCache('articles');
      state.gallery = getCache('gallery');
      state.contacts = getCache('contacts');
      try { const lp = localStorage.getItem('smpn20_profil_cache'); if(lp) state.profil = JSON.parse(lp); } catch(e) {}
      state.loading = false;
      handleHashChange();
      await syncDataFromServer();
    }

    function handleHashChange() {
      const dd = document.getElementById('navDropdown'); if (dd) dd.classList.remove('active');
      const urlParams = new URLSearchParams(window.location.search);
      const idArtikelQuery = urlParams.get('artikel') || urlParams.get('id');
      const hash = window.location.hash.replace("#", "");
      const [page, param] = hash.split("/");

      if (idArtikelQuery) state.route = { page: 'artikel', param: idArtikelQuery };
      else state.route = { page: page || "beranda", param: param || null };

      window.scrollTo(0, 0); 
      render();
    }

    const app = document.getElementById('app');
    function render() {
      if (state.loading) return; const { page, param } = state.route; document.body.classList.remove("no-scroll");
      if (page === 'beranda') app.innerHTML = viewBeranda();
      else if (page === 'pencarian') app.innerHTML = viewPencarian();
      else if (page === 'artikel' && param) app.innerHTML = viewArtikel(param);
      else if (page === 'galeri') app.innerHTML = viewGaleri();
      else if (page === 'kontak' || page === 'informasi') app.innerHTML = viewInformasi();
      else app.innerHTML = `<h2 style="text-align:center; margin-top:50px;">404 - Halaman tidak ditemukan</h2>`;
    }

    function filterArsip(k) { currentSearchKeyword = k; document.getElementById("searchResults").innerHTML = getFilteredArticlesHtml(); }

    }

    function viewArtikel(id) {
      document.body.classList.add("no-scroll");
      const art = state.articles.find(a => String(a.id) === String(id)); if(!art) return `<h2 style="text-align:center;">Berita tidak ditemukan</h2>`;
      let urls = art.foto_url ? art.foto_url.split(',').map(u => u.trim()).filter(u => u) : [];
      let align = 'left'; let rawText = art.isi || '';
      if(rawText.startsWith('[align:')) { const match = rawText.match(/^\[align:(left|center|right|justify)\]\n?/); if(match) { align = match[1]; rawText = rawText.replace(/^\[align:(left|center|right|justify)\]\n?/, ''); } }
      let mediaHtml = urls.length > 0 ? `<div onclick="openLightbox('${sanitizeAttr(urls[0])}', '${encodeURIComponent(art.judul)}')" style="cursor:pointer;">${renderMediaElement(urls[0], "width:100%; max-height:420px; object-fit:contain; border-radius:8px; margin-bottom:12px;")}</div>` : '';
      if(urls.length > 1) { mediaHtml += `<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:15px;">` + urls.slice(1).map(u => `<div onclick="openLightbox('${sanitizeAttr(u)}', '${encodeURIComponent(art.judul)}')" style="cursor:pointer;">${renderMediaElement(u, "width:100%; aspect-ratio: 16/9; object-fit:cover; border-radius:6px; border:1px solid var(--border-color);")}</div>`).join('') + `</div>`; }
      
      const recHtml = state.articles.filter(a => String(a.id) !== String(id)).slice(0, 3).map(r => `<div style="background:var(--card-bg); padding:8px 10px; border-radius:8px; border:1px solid var(--border-color); margin-bottom:10px;">
        <a href="#artikel/${r.id}">
          <div style="display:flex; gap:10px; align-items:center;">
            <div style="width:65px; height:55px; flex-shrink:0;">${renderMediaElement(r.foto_url ? r.foto_url.split(',')[0].trim() : '', "width:65px; height:55px; object-fit:cover; border-radius:6px;")}</div>
            <div>
              <span class="text-sm" style="color:var(--accent); font-weight:600; font-size:0.7rem;">${sanitizeHTML(r.kategori)}</span>
              <h4 style="color:var(--text-dark); line-height:1.2; font-size:0.85rem;">${sanitizeHTML(r.judul)}</h4>
            </div>
          </div>
        </a>
        <div style="margin-top:6px; display:flex; justify-content:flex-end;">
          <button class="btn-share-minimal" onclick="shareArticleLink(event, '${r.id}', '${encodeURIComponent(r.judul)}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            <span>Bagikan</span>
          </button>
        </div>
      </div>`).join('');
      
      return `<article class="fullscreen-article">
        <a href="#beranda" class="btn-close-floating" title="Tutup Berita">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
        <div style="max-width:800px; margin:0 auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:10px; padding-right:45px;">
            <span class="badge">${sanitizeHTML(art.kategori)}</span>
            <button class="btn-share-minimal" onclick="shareArticleLink(event, '${art.id}', '${encodeURIComponent(art.judul)}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
              <span>Bagikan Tautan</span>
            </button>
          </div>
          <h1 style="font-size:1.5rem; margin-bottom:6px; line-height:1.25;">${sanitizeHTML(art.judul)}</h1>
          <p class="text-sm" style="margin-bottom:15px;">${formatDate(art.tanggal || art.created_at)}</p>
          ${mediaHtml}<div style="font-size:0.98rem; text-align:${align}; margin-top:15px; line-height:1.75;">${sanitizeHTML(rawText)}</div>
          ${recHtml ? `<div style="margin-top:30px; border-top:1px solid var(--border-color); padding-top:20px;">${recHtml}</div>` : ''}
        </div>
      </article>`;
    }

    function viewGaleri() {
      document.title = "Galeri - SMPN 20 BOGOR";
      let mediaList = []; state.articles.forEach(art => { if(art.foto_url) art.foto_url.split(',').forEach((u, idx) => { if(u.trim()) mediaList.push({ title: art.judul, url: u.trim() }); }); });
      state.gallery.forEach(g => { if(g.foto_url) mediaList.push({ title: g.judul, url: g.foto_url }); });
      if(!mediaList.length) return `<h2>Galeri Sekolah</h2><div class="card"><p>Belum ada media.</p></div>`;
      return `<h2>Galeri Sekolah</h2><div class="grid grid-3">` + mediaList.map(m => `<div class="card card-hover" onclick="openLightbox('${sanitizeAttr(m.url)}', '${encodeURIComponent(m.title)}')" style="cursor:pointer;">${renderMediaElement(m.url, "width:100%; height:150px; object-fit:cover; border-radius:8px; margin-bottom:8px;")}<h4 style="font-size:0.88rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${sanitizeHTML(m.title)}</h4><span class="text-sm" style="color:var(--primary); font-size:0.72rem;">Buka / Tonton ⬇</span></div>`).join('') + `</div>`;
    }

    function viewInformasi() {
      document.title = "Informasi - SMPN 20 BOGOR";
      let html = `<h2>Informasi Sekolah</h2>`;
      if(state.profil) {
        let mapEmbedUrl = parseMapsUrl(state.profil.map_url);
        html += `<div class="card" style="margin-bottom:15px;"><h3 style="margin-bottom:8px;">Profil & Sambutan</h3><div style="text-align:left; margin-bottom:15px;">${sanitizeHTML(state.profil.isi)}</div>${mapEmbedUrl ? `<h4 style="margin-bottom:8px; font-size:0.95rem;">Lokasi</h4><iframe src="${sanitizeAttr(mapEmbedUrl)}" width="100%" height="280" style="border:0; border-radius:8px;" allowfullscreen="" loading="lazy"></iframe>` : `<p class="text-sm">Peta belum diatur.</p>`}</div>`;
      }
      html += `<h3 style="margin-top:20px; margin-bottom:10px;">Sosial Media</h3><div class="social-icons-grid">`;
      ['WhatsApp', 'Instagram', 'TikTok', 'YouTube', 'Email'].forEach(plat => {
        const found = state.contacts.find(c => c.nama_platform === plat); const iconData = socialBrandIcons[plat];
        if(found) html += `<a href="${sanitizeAttr(parseKontakUrl(found.nama_platform, found.url))}" target="_blank" class="social-icon-btn" style="background:${iconData.color};" title="${plat}">${iconData.svg}</a>`;
        else html += `<div class="social-icon-btn muted" style="background:${iconData.color};" title="${plat}">${iconData.svg}</div>`;
      });
      state.contacts.filter(c => !['WhatsApp', 'Instagram', 'TikTok', 'YouTube', 'Email'].includes(c.nama_platform)).forEach(ext => {
        html += `<a href="${sanitizeAttr(parseKontakUrl(ext.nama_platform, ext.url))}" target="_blank" class="social-icon-btn" style="background:${socialBrandIcons['Lainnya'].color};" title="${sanitizeAttr(ext.nama_platform)}">${socialBrandIcons['Lainnya'].svg}</a>`;
      });
      return html + `</div>`;
    }

    async function directDownloadBlob(url) {
      if (url.startsWith('blob:') || url.startsWith('data:')) { const a = document.createElement('a'); a.href = url; a.download = "media_" + Date.now() + ".jpg"; document.body.appendChild(a); a.click(); document.body.removeChild(a); return; }
      try { const res = await fetch(url); if(!res.ok) throw new Error(); const blob = await res.blob(); const bUrl = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = bUrl; a.download = "media_" + Date.now() + (blob.type.includes('video') ? '.mp4' : '.jpg'); document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(bUrl); } catch(err) { window.open(url, '_blank'); }
    }
    function openLightbox(url, titleEncoded) {
      const wrapper = document.getElementById("lightboxMediaWrapper"); const btn = document.getElementById("lightboxDownloadBtn"); const info = getSmartThumbnail(url);
      if (info.type === 'youtube') { wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${info.videoId}?autoplay=1&rel=0" frameborder="0" allowfullscreen style="width:100%; height:320px; border-radius:8px;"></iframe>`; btn.onclick = () => window.open(info.url, '_blank'); }
      else if (info.type === 'video_direct') { wrapper.innerHTML = `<video src="${sanitizeAttr(info.url)}" controls autoplay style="width:100%; max-height:65vh; border-radius:8px;"></video>`; btn.onclick = () => directDownloadBlob(info.url); }
      else if (info.type === 'social_link') { wrapper.innerHTML = `<div style="background:linear-gradient(135deg, #1E293B, #0F172A); padding:30px 15px; border-radius:8px;"><h3 style="color:#FFF;">Tautan ${info.platform}</h3></div>`; btn.onclick = () => window.open(info.url, '_blank'); }
      else { wrapper.innerHTML = `<img src="${sanitizeAttr(info.thumb)}" style="max-width:100%; max-height:65vh; border-radius:8px; margin:0 auto; object-fit:contain;">`; btn.onclick = () => directDownloadBlob(info.thumb); }
      document.getElementById("lightboxModal").style.display = "flex";
    }
    function closeLightbox(e) { if(e.target.id === 'lightboxModal') closeLightboxDirect(); }
    function closeLightboxDirect() { document.getElementById("lightboxMediaWrapper").innerHTML = ""; document.getElementById("lightboxModal").style.display = "none"; }

    // Supabase Realtime Sync
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    supabaseClient.channel('public:db_changes')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => {
        syncDataFromServer();
      })
      .subscribe();

    window.addEventListener("hashchange", handleHashChange);
    window.addEventListener("DOMContentLoaded", handleHashChange);
    loadData();
  </script>
</body>
</html>
